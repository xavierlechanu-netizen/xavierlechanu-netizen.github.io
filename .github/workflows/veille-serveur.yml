# Veille du serveur (24/11/2026) : vérifie depuis l'extérieur, toutes les 5 minutes, que le site
# et l'API répondent. Sinon, SMS par OVHcloud (France) : un au début, un rappel toutes les 3 h, un au retour.
# Secrets (Settings > Secrets and variables > Actions) : OVH_SMS_APP_KEY, OVH_SMS_APP_SECRET,
# OVH_SMS_CONSUMER_KEY, OVH_SMS_SERVICE, ALERTE_SMS_NUMERO. Saisie : sovereign-core/deploy/windows/saisir-cles-github.cmd.
# Une veille en échec envoie aussi l'e-mail habituel de GitHub (filet de secours gratuit).
# shortcut: GitHub peut retarder les tâches planifiées de quelques minutes ; un service de veille dédié si ça ne suffit plus.
name: Veille du serveur

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      essai:
        description: "Envoyer un SMS d'essai (rien n'est cassé)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # lire le résultat de la veille précédente

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Site et API
        env:
          OVH_SMS_APP_KEY: ${{ secrets.OVH_SMS_APP_KEY }}
          OVH_SMS_APP_SECRET: ${{ secrets.OVH_SMS_APP_SECRET }}
          OVH_SMS_CONSUMER_KEY: ${{ secrets.OVH_SMS_CONSUMER_KEY }}
          OVH_SMS_SERVICE: ${{ secrets.OVH_SMS_SERVICE }}
          ALERTE_SMS_NUMERO: ${{ secrets.ALERTE_SMS_NUMERO }}
          GITHUB_TOKEN: ${{ github.token }}
          ESSAI: ${{ inputs.essai }}
        run: node scripts/veille-serveur.js
