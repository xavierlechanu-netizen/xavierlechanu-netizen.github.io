# Compilation du firmware de la boîte noire avec la chaîne officielle ESP-IDF (Espressif)
name: Firmware boîte noire (ESP32-C3)

on:
  push:
    paths:
      - "hardware/firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "hardware/firmware/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilation ESP-IDF v5.3 (esp32c3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32c3
          path: hardware/firmware
          # En cas d'échec, relance ninja en continuant pour lister toutes les erreurs d'un coup
          command: "idf.py build || (ninja -C build -k 0 >/dev/null 2>&1; ninja -C build -k 0; exit 1)"

      - name: Taille du binaire
        run: ls -l hardware/firmware/build/*.bin

      - name: Binaire compilé
        uses: actions/upload-artifact@v4
        with:
          name: firmware-blackbox-esp32c3
          path: |
            hardware/firmware/build/*.bin
            hardware/firmware/build/bootloader/bootloader.bin
            hardware/firmware/build/partition_table/partition-table.bin
          retention-days: 30
