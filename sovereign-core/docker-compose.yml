# ============================================================================
# sovereign-core/docker-compose.yml
# Déploiement Souverain Clé en Main pour Serveur OVHcloud (Debian 12 / Ubuntu 24.04)
# Zéro dépendance Google Cloud / Firebase
# ============================================================================

services:
  postgres-postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: mon50cc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mon50ccetmoi
      POSTGRES_USER: ${DB_USER:-mon50cc_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Variable DB_PASSWORD requise}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mon50cc_admin} -d mon50ccetmoi"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7.4-alpine
    container_name: mon50cc-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"

  sovereign-api:
    # Image construite avec ses dépendances (pg) : voir sovereign-core/Dockerfile
    build:
      context: ..
      dockerfile: sovereign-core/Dockerfile
    container_name: mon50cc-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      SOVEREIGN_CORS_ORIGIN: https://mon50ccetmoi.com
      DATABASE_URL: postgres://${DB_USER:-mon50cc_admin}:${DB_PASSWORD}@postgres-postgis:5432/mon50ccetmoi
      REDIS_URL: redis://redis-cache:6379
      SOVEREIGN_JWT_PRIVATE_KEY: ${SOVEREIGN_JWT_PRIVATE_KEY:?Cle JWT requise (node scripts/generate-jwt-keys.js)}
      SOVEREIGN_JWT_PUBLIC_KEY: ${SOVEREIGN_JWT_PUBLIC_KEY:?Cle JWT requise}
      SOVEREIGN_TRUST_PROXY: ${SOVEREIGN_TRUST_PROXY:-0}
      REVOLUT_WEBHOOK_SECRET: ${REVOLUT_WEBHOOK_SECRET:-}
      # Coffre des preuves : bucket OVHcloud Object Storage créé avec Object Lock activé
      WORM_S3_BUCKET: ${WORM_S3_BUCKET:?Bucket S3 Object Lock requis pour les preuves}
      WORM_S3_ENDPOINT: ${WORM_S3_ENDPOINT:-https://s3.gra.io.cloud.ovh.net}
      WORM_S3_REGION: ${WORM_S3_REGION:-gra}
      WORM_S3_ACCESS_KEY_ID: ${WORM_S3_ACCESS_KEY_ID:?Cle S3 requise}
      WORM_S3_SECRET_ACCESS_KEY: ${WORM_S3_SECRET_ACCESS_KEY:?Cle S3 requise}
      WORM_RETENTION_DAYS: ${WORM_RETENTION_DAYS:-1826}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres-postgis:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:

